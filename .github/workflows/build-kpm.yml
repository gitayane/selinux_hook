name: Build CI

on:
  push:
    paths:
      - ".github/workflows/build-kpm.yml"
      - ".gitmodules"
      - "KernelPatch"
      - "**.c"
      - "**.h"
      - "**/Makefile"

  workflow_dispatch:
    inputs:
      release:
        description: 'Push a new release'
        required: false
        default: 'false'
      version:
        description: 'release version'
        required: false
        default: '2024051900'

jobs:
  Build-on-Ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: UTC-8
      EXPECTED_KP_COMMIT: 22ad5c7516475842f79e321b09d5d4e313de8e87

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Update system and install dependencies
        run: |
          sudo apt update -y

      - name: Install Compiler
        run: |
          curl -o arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz

      - name: Verify KernelPatch source
        shell: bash
        run: |
          set -euo pipefail

          actual="$(git -C KernelPatch rev-parse HEAD)"
          echo "KernelPatch HEAD: $actual"
          echo "KernelPatch remote: $(git -C KernelPatch remote get-url origin)"
          echo "KernelPatch version:"
          cat KernelPatch/version

          test "$actual" = "$EXPECTED_KP_COMMIT"

          grep -q '^#define MAJOR 0$' KernelPatch/version
          grep -q '^#define MINOR 13$' KernelPatch/version
          grep -q '^#define PATCH 9$' KernelPatch/version

          echo "KernelPatch baseline verified: 0.13.9 @ $EXPECTED_KP_COMMIT"

      - name: Build kpm
        env:
          TARGET_COMPILE: ${{ github.workspace }}/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
        run: |
          mkdir target

          for dir in $(ls -d */ | grep -v '^KernelPatch/$\|^target/$\|^arm-gnu-toolchain'); do
            make -C ${dir}
            mv ${dir}*.kpm target
          done

      - name: Inspect KPM symbols
        shell: bash
        run: |
          set -euo pipefail
          for kpm in target/*.kpm; do
            echo "=== ${kpm} ==="
            readelf -h "${kpm}" | sed -n "1,20p"
            readelf -S "${kpm}" | grep -E "kpm|symtab|strtab|eh_frame|rela.eh_frame" || true
          done

      - name: Upload artifact
        if: success()
        uses: lzghzr/upload-artifact@405e6269d5b1feb22bf2a044deb7950596bed6da
        with:
          path: "target/*.kpm"
          artifact-per-file: true
          artifact-name-rule: ${name}

      - name: Upload release
        if: github.event.inputs.release == 'true' && success() && !cancelled()
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          body: This release is built by github-action.
          artifacts: "target/*.kpm"
          allowUpdates: true
          makeLatest: true
          omitBodyDuringUpdate: true
          replacesArtifacts: true
